<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz Board</title>
  </head>
  <body>
    <h1>QUIZ BOARD</h1>
    <p class="subtitle" id="subtitle"></p>

    <div class="scoreboard" id="scoreboard"></div>
    <div class="board" id="board"></div>

    <div class="controls" id="controls"></div>

    <!-- Question Modal -->
    <div class="overlay" id="q-overlay" style="display: none">
      <div class="modal" id="q-modal">
        <button class="modal-close" type="button" id="btn-close-question">&#10005;</button>
        <div class="modal-pts" id="m-pts"></div>
        <div class="modal-cat" id="m-cat"></div>
        <div class="q-image-wrap" id="m-image-wrap" style="display: none">
          <img id="m-image" src="" alt="Question image" />
        </div>
        <div class="q-display" id="m-question"></div>
        <div class="a-display" id="m-answer"></div>
        <div class="team-selector" id="m-teams"></div>
        <div class="modal-btn-row">
          <button class="modal-btn btn-reveal" type="button" id="btn-reveal">Reveal Answer</button>
          <button class="modal-btn btn-correct" type="button" id="btn-correct" style="display: none">&#10003; Correct</button>
          <button class="modal-btn btn-wrong" type="button" id="btn-wrong" style="display: none">&#10007; Wrong</button>
          <button class="modal-btn btn-skip" type="button" id="btn-skip">Skip</button>
        </div>
      </div>
    </div>

    <!-- Edit Modal -->
    <div class="overlay" id="edit-overlay" style="display: none">
      <div class="modal edit-modal" id="edit-modal">
        <button class="modal-close" type="button" id="btn-close-edit">&#10005;</button>
        <div id="edit-content"></div>
      </div>
    </div>

    <!-- Admin Modal -->
    <div class="overlay" id="admin-overlay" style="display: none">
      <div class="modal admin-modal" id="admin-modal">
        <button class="modal-close" type="button" id="btn-close-admin">&#10005;</button>
        <div id="admin-content"></div>
        <button class="edit-save" type="button" id="btn-save-admin">Save All Changes</button>
      </div>
    </div>

    <!-- Winner Modal -->
    <div class="overlay" id="winner-overlay" style="display: none">
      <div class="modal winner-modal" id="winner-modal">
        <button class="modal-close" type="button" id="btn-close-winner">&#10005;</button>
        <div class="winner-trophy">&#127942;</div>
        <div id="winner-content"></div>
      </div>
    </div>

    <!-- Team Setup Modal -->
    <div class="overlay" id="team-setup-overlay" style="display: none">
      <div class="modal team-setup-modal" id="team-setup-modal">
        <button class="modal-close" type="button" id="btn-close-team-setup">&#10005;</button>
        <div id="team-setup-content"></div>
      </div>
    </div>

    <!-- Templates -->
    <template id="tmpl-team-card">
      <div class="team-card" data-action="select-team">
        <div class="team-name-wrap">
          <span class="team-label">Player / Team</span>
          <input class="team-name" type="text" />
        </div>
        <div class="team-score"></div>
        <div class="team-btn-group">
          <button class="score-btn add" type="button" data-action="adjust-score" data-delta="100">+100</button>
          <button class="score-btn sub" type="button" data-action="adjust-score" data-delta="-100">-100</button>
        </div>
      </div>
    </template>

    <template id="tmpl-cat-header">
      <div class="cat-header">
        <button class="cat-name" type="button" title="Click to rename" data-action="edit-category"></button>
      </div>
    </template>

    <template id="tmpl-tile">
      <button class="tile" type="button" data-action="open-question">
        <span class="tile-pts"></span>
      </button>
    </template>

    <template id="tmpl-ts-chip">
      <button class="ts-chip" type="button" data-action="select-awarding"></button>
    </template>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
